model:
  default: deepseek-chat
  provider: custom
  base_url: https://api.deepseek.com/v1
terminal:
  backend: local
agent:
  max_turns: 15
platform_toolsets:
  cli:
    - hermes-cli
fallback_providers:
  - provider: openrouter
    model: qwen/qwen3.7-max
  - provider: qwen-oauth
    model: qwen/qwen3.7-max
approvals:
  destructive_slash_confirm: true
platforms:
  telegram:
    allow_admin_from:
      - "534151570"
    group_allow_admin_from:
      - "534151570"
    user_allowed_commands:
      - help
      - whoami
      - status
    group_user_allowed_commands:
      - help
      - whoami
      - status
